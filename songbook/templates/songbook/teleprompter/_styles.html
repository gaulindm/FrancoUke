<style>
  /* ===== Theme + chord color + text size, all overridable live ===== */
  :root {
    --chord-color: #2a6f97;
    --text-scale: 1;

    --bg-color: #ffffff;
    --text-color: #1a1a1a;
    --controls-bg: #f4f4f4;
    --controls-border: #d8d8d8;
    --button-bg: #ffffff;
    --button-text: #1a1a1a;
    --bg: #ffffff; --fg: #1a1a1a; --muted: #666666; --accent: #ff8c00;
  }
  html[data-theme="dark"] {
    --bg-color: #121212;
    --text-color: #f0f0f0;
    --controls-bg: #1e1e1e;
    --controls-border: #3a3a3a;
    --button-bg: #2a2a2a;
    --button-text: #f0f0f0;
    --bg: #121212; --fg: #f0f0f0; --muted: #9aa6b2; --accent: #ffd166;
  }

  body {
    background: var(--bg-color);
    color: var(--text-color);
  }
  .controls {
    background: var(--controls-bg);
    color: var(--text-color);
    border-color: var(--controls-border);
  }
  .controls button,
  .controls .layout-toggle button {
    background: var(--button-bg);
    color: var(--button-text);
    border-color: var(--controls-border);
  }
  #chord-section {
    background: var(--bg-color);
    color: var(--text-color);
  }

  /* Chord diagrams (fretboards) drawn by chord_diagrams.js: force them
     to plain black in light mode. Targets any element that has an
     inline fill/stroke set to something other than "none", so open
     string circles (fill="none") stay hollow instead of turning into
     solid black dots. Left untouched in dark mode. */
  html[data-theme="light"] #chord-diagrams svg [fill]:not([fill="none"]),
  html[data-theme="light"] #chord-diagrams svg text {
    fill: #000 !important;
  }
  html[data-theme="light"] #chord-diagrams svg [stroke]:not([stroke="none"]) {
    stroke: #000 !important;
  }

  .chord-label {
    font-weight: 700;
    color: var(--chord-color);
    white-space: nowrap;
  }

  /* Text size applies to both lyrics and (via em, below) the chord
     names, so the +/- control scales the whole song together. */
  .lyrics .verse,
  .lyrics .section-body,
  .lyrics .centered {
    font-size: calc(1em * var(--text-scale));
  }

  /* ===== Chords ABOVE the lyrics ===== */
  /* 🔧 TUNE: line-height leaves room for the chord name above each line.
     Roughly 2.6-2.8 is the lower limit before the names (-1.3em)
     start crowding the line above. */
  html[data-chord-style="above"] .lyrics .verse,
  html[data-chord-style="above"] .lyrics .section-body,
  html[data-chord-style="above"] .lyrics .centered {
    line-height: 2.2;
  }

  html[data-chord-style="above"] .chord-word {
    position: relative;
    display: inline-block;
    /* The renderer adds an inline min-width (based on the chord name's
       length) so a short lyric like "//" can't let chords collide. */
  }
  /* Zero-width character so even an empty chord-word keeps full line
     height and its chord name lines up with all the others. */
  html[data-chord-style="above"] .chord-word::before {
    content: "\200B";
  }
  html[data-chord-style="above"] .chord-label {
    position: absolute;
    top: -0.8em;
    left: 0;
    font-size: 0.85em;
  }
/* Strum lines like [G]//  [C]//  [G]////: more room between chords and groups */
html[data-chord-style="above"] .chord-word.chord-strum {
  margin-right: 0.8em;        /* 🔧 TUNE: 0.4em = a touch wider, 1em = much wider */
}
  /* ===== Chords INLINE, e.g. [C]One, two, [CM7]three, four ===== */
  html[data-chord-style="inline"] .chord-word {
    display: inline;
  }
  html[data-chord-style="inline"] .chord-label {
    position: static;
    display: inline;
    font-size: 0.9em;
  }
  html[data-chord-style="inline"] .chord-label::before { content: "["; }
  html[data-chord-style="inline"] .chord-label::after  { content: "]"; }

  /* Extra breathing room before the first verse. */
  .lyrics .metadata {
    margin-bottom: 2rem;
  }
  /* {st:...} / {subtitle:...} — sits directly under the title, quieter
     than it so it doesn't compete for attention. */
  .song-subtitle {
    font-style: italic;
    font-size: 1.1em;
    opacity: 0.75;
    margin-top: -0.5rem;
  }

  /* ===== Singing groups: {c:1} / {c:2} marks the line after it ===== */
  .lyrics .grp {
    --grp: #666;
    border-left: 4px solid var(--grp);
    padding-left: 0.6em;
    background: color-mix(in srgb, var(--grp) 10%, transparent);
  }
  .lyrics .grp-1 { --grp: #c0392b; }
  .lyrics .grp-2 { --grp: #2471a3; }
  .lyrics .grp-badge {
    display: inline-block;
    min-width: 1.6em;
    text-align: center;
    border-radius: 1em;
    padding: 0 0.5em;
    margin-right: 0.6em;
    font-size: 0.7em;
    font-weight: 700;
    white-space: nowrap;
    color: #fff;
    background: var(--grp);
  }
  /* ===== Hold cue: {c:(23)} = keep strumming the last chord on those beats ===== */
  .lyrics .hold-cue {
    color: orange;
    font-weight: 700;
    font-style: italic;
    margin-left: 0.3em;
    white-space: nowrap;
  }
  /* ===== Tab blocks: {sot} ... {eot} ===== */
  html .lyrics pre.tab-block,
  html[data-chord-style] .lyrics pre.tab-block {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
    font-size: 0.9em;
    line-height: 1.2 !important;   /* 🔧 TUNE: 1.1 = tighter, 1.3 = looser */
    white-space: pre;
    text-align: left;
    overflow-x: auto;
    margin: 0.4em 0;
    padding: 0.3em 0.6em;
    background: color-mix(in srgb, var(--text-color) 6%, transparent);
    border-radius: 4px;
  }
  /* ===== Chorus: bar down the left side ({soc} ... {eoc}) =====
     Needs the renderer to emit class="section section-chorus". */
  .lyrics .section-chorus {
    border-left: 8px solid var(--accent);   /* 🔧 TUNE: colour / thickness */
    padding-left: 0.8em;
    text-align: left;
  }
  .lyrics .section-chorus .section-body {
    display: block;          /* was inline-block, which hugged the text */
    text-align: left;
  }

  .ph { visibility: hidden; }

    /* ===== Standalone {c:...} comments: lyric-sized, red, left-aligned ===== */
    :root { --comment-color: #d62828; }
  html[data-theme="dark"] { --comment-color: #ff6b6b; }  /* brighter red for dark backgrounds */

  .lyrics .song-comment {
    font-size: calc(1em * var(--text-scale));   /* same as the lyrics, follows the A-/A+ control */
    color: var(--comment-color);
    text-align: left;
    line-height: 1;       /* the chords-above line-height of 2.2 would leave a big gap here */
    margin: 0.4em 0 0.2em;  /* 🔧 TUNE: small gap under the comment, like the PDF */
    font-style: italic;     /* remove this line for upright text */
  }

  /* ===== Intro / Interlude blocks: {soi}..{eoi} and {sod}..{eod} =====
     In "chords above" mode these switch to the inline look, so ( ) and -
     stay level with the chords instead of dropping below them. */
     html[data-chord-style="above"] .lyrics .section-inline .section-body {
    line-height: 1.3;   /* 🔧 TUNE: single spacing; 1.2 = tighter, 1.5 = looser */
  }
  html[data-chord-style="above"] .section-inline .chord-word {
    display: inline;
  }
  html[data-chord-style="above"] .section-inline .chord-label {
    position: static;
    display: inline;
    font-size: 0.9em;
  }
  html[data-chord-style="above"] .section-inline .chord-label::before { content: "["; }
  html[data-chord-style="above"] .section-inline .chord-label::after  { content: "]"; }

    /* ===== Everything left-aligned (easier to follow on wide screens) ===== */
    html .lyrics,
  html .lyrics .verse,
  html .lyrics .centered,
  html .lyrics .section,
  html .lyrics .section-name,
  html .lyrics .section-body,
  html .lyrics .song-comment {
    text-align: left;
  }
  /* The old inline-block made non-chorus sections shrink to their text and
     sit in the middle of the page. Let them fill the width from the left. */
  html .lyrics .section-body {
    display: block;
  }
    /* ===== Strumming-pattern tail at the end of a lyric line =====
     Same inline look as Intro/Interlude, but only for the chords the
     renderer tagged chord-inline. The words before them keep their
     chords above. */
     html[data-chord-style="above"] .chord-word.chord-inline {
    display: inline;
  }
  html[data-chord-style="above"] .chord-word.chord-inline .chord-label {
    position: static;
    display: inline;
    font-size: 0.9em;
  }
  html[data-chord-style="above"] .chord-word.chord-inline .chord-label::before { content: "["; }
  html[data-chord-style="above"] .chord-word.chord-inline .chord-label::after  { content: "]"; }
    /* ===== Exit button (top-left of the controls bar) ===== */
    .exit-btn {
    display: inline-block;
    padding: 8px 14px;            /* 🔧 TUNE: big enough for a thumb on a phone */
    margin-right: 10px;
    border: 1px solid var(--controls-border);
    border-radius: 6px;
    background: var(--button-bg);
    color: var(--button-text);
    text-decoration: none;
    font-weight: 600;
    white-space: nowrap;
  }
  /* ===== Second controls row (⋯ button toggles it) ===== */
  .controls { flex-wrap: wrap; }              /* lets the second row drop below */
  .controls .controls-more {
    flex: 1 0 100%;                           /* full-width row under the main bar */
    order: 99;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px 24px;                            /* 🔧 TUNE: row gap / column gap */
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid var(--controls-border);
  }
  .controls .controls-more[hidden] { display: none; }   /* display:flex would otherwise override [hidden] */
  #tp-more-toggle { font-weight: 700; letter-spacing: 0.1em; }
  #tp-more-toggle[aria-expanded="true"] { outline: 2px solid var(--accent); }
  /* ===== Diagram position + size controls, inside the diagram panel ===== */
  #chord-section .diagram-tools {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;
    gap: 4px 12px;
    padding: 2px 6px;
    font-size: 0.8rem;                        /* 🔧 TUNE: size of the little buttons */
  }
  #chord-section .layout-toggle { display: inline-flex; }
  #chord-section .layout-toggle button {
    background: var(--button-bg);
    color: var(--button-text);
    border: 1px solid var(--controls-border);
    padding: 2px 8px;
    font-size: inherit;
    cursor: pointer;
  }
  #chord-section .layout-toggle button[aria-pressed="true"] {
    background: var(--accent);
    color: #000;
    font-weight: 700;
  }
  /* ===== Keep the top row on one line (iPad etc.) ===== */
  .controls .left { min-width: 0; }
  .controls .song-title {
    display: inline-block;
    max-width: 28vw;                          /* 🔧 TUNE: how much room the title gets */
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    vertical-align: middle;
  }
  @media (max-width: 1100px) {                /* 🔧 TUNE: below this width, drop the extras */
    .sl-num { display: none; }                /* "Setlist 12 – " prefix on the setlist page */
    #fontsize-control > span:first-child { display: none; }   /* the word "Size" */
  }
  /* In the second row there is room: show the full setlist name and number */
  .controls .controls-more .song-title { max-width: none; }
  .controls .controls-more .sl-num { display: inline; }
    /* ===== Echo lines: {c:echo: words} sung over the line above ===== */
    .lyrics .echo-line {
    font-style: italic;
    font-size: 1em;                  /* inherits the lyric size, so A-/A+ scales it */
    color: var(--echo-color, inherit);   /* 🔧 TUNE: set --echo-color later to change the colour */
    margin: 0 0 0.5em 2em;           /* 🔧 TUNE: 2em = indent; last number = space below */
    line-height: 1.3;
    text-align: left;
  }
  /* In chords-above mode the lyric line above has line-height 2.2, which leaves
     empty space under its text. Pull the echo up into it. */
  html[data-chord-style="above"] .lyrics .echo-line {
    margin-top: -0.5em;              /* 🔧 TUNE: -0.3em = looser, -0.7em = tighter */
  }
</style>
