{% load user_extras %}
{% with vid=song.metadata.youtube|youtube_id %}
    {% if vid %}
        <button type="button" class="btn btn-sm btn-outline-danger"
                data-bs-toggle="modal" data-bs-target="#videoModal"
                data-video-id="{{ vid }}"
                data-song-title="{{ song.songTitle }}"
                title="{% if site_name == 'FrancoUke' %}Voir la vidéo{% else %}Watch video{% endif %}">
            🎥
        </button>
    {% endif %}
{% endwith %}
