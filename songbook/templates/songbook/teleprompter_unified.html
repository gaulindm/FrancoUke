{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ song.title }}</title>
  <link rel="stylesheet" href="{% static 'songbook/css/teleprompter.css' %}">

  <!-- Diagram renderer -->
  <script src="{% static 'songbook/js/chord_diagrams.js' %}"></script>

  <!-- Chord style (above / inline). Runs before the page paints so there is
       no flash. Choice is remembered in this browser; default is "above". -->
  <script>
    (function () {
      var style = "above";
      try {
        var saved = localStorage.getItem("chordStyle");
        if (saved === "above" || saved === "inline") style = saved;
      } catch (e) {}
      document.documentElement.setAttribute("data-chord-style", style);
    })();
  </script>

  <!-- The server always renders the chord-above markup (.chord-word /
       .chord-label). These rules decide how it LOOKS. Chord diagram
       placement (bottom / right) is handled by teleprompter.css +
       teleprompter.js. -->
  <style>
    .chord-label {
      font-weight: 700;
      color: #2a6f97;
      white-space: nowrap;
    }

    /* ===== Chords ABOVE the lyrics ===== */
    /* 🔧 TUNE: line-height leaves room for the chord name above each line.
       Roughly 2.6-2.8 is the lower limit before the names (-1.3em)
       start crowding the line above. */
    html[data-chord-style="above"] .lyrics .verse,
    html[data-chord-style="above"] .lyrics .section-body,
    html[data-chord-style="above"] .lyrics .centered {
      line-height: 3;
    }
    html[data-chord-style="above"] .chord-word {
      position: relative;
      display: inline-block;
    }
    /* Zero-width character so even an empty chord-word keeps full line
       height and its chord name lines up with all the others. */
    html[data-chord-style="above"] .chord-word::before {
      content: "\200B";
    }
    html[data-chord-style="above"] .chord-label {
      position: absolute;
      top: -1.3em;
      left: 0;
      font-size: 0.85em;
    }

    /* ===== Chords INLINE, e.g. [C]One, two, [CM7]three, four ===== */
    html[data-chord-style="inline"] .chord-word {
      display: inline;
    }
    html[data-chord-style="inline"] .chord-label {
      position: static;
      display: inline;
      font-size: 0.9em;
    }
    html[data-chord-style="inline"] .chord-label::before { content: "["; }
    html[data-chord-style="inline"] .chord-label::after  { content: "]"; }

    /* Extra breathing room before the first verse. */
    .lyrics .metadata {
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <!-- Controls -->
  <div class="controls">
    <div class="left">
      <span class="song-title">{{ song.title }}</span>
    </div>
    <div class="center">
      <button id="scroll-toggle">▶️ Start</button>
      <div class="control-inline">
        <button id="speed-down">−</button>
        <span id="speed-value">3</span>
        <button id="speed-up">+</button>
      </div>
      <div class="control-inline" id="transpose-control">
        <span>Transpose</span>
        <button id="transpose-down">−</button>
        <span id="transpose-value">0</span>
        <button id="transpose-up">+</button>
      </div>
    </div>
    <div class="right">
      <div class="layout-toggle" role="group" aria-label="Chord style">
        <button type="button" id="chord-style-above" aria-pressed="true">Above</button>
        <button type="button" id="chord-style-inline" aria-pressed="false">Inline</button>
      </div>
      <div class="layout-toggle" role="group" aria-label="Chord diagram position">
        <button type="button" id="chord-layout-bottom" aria-pressed="true">Bottom</button>
        <button type="button" id="chord-layout-right" aria-pressed="false">Right</button>
      </div>
      <button id="scroll-reset">⏹ Reset</button>
    </div>
  </div>

  <!-- Lyrics -->
  <div class="tp-main">
    <div class="lyrics-container">
      <div class="lyrics">
        <div class="metadata">
          <h1>{{ song.songTitle }}</h1>
          {% if metadata.songwriter %}
            <div class="songwriter">{{ metadata.songwriter }}</div>
          {% endif %}
          {% if metadata.artist %}
            <div class="recording">
              {{ metadata.artist }}{% if metadata.year %} ({{ metadata.year }}){% endif %}
            </div>
          {% endif %}
        </div>
        {{ lyrics_with_chords|safe }}
      </div>
    </div>
  </div>

  <!-- ✅ Embedded chords JSON for teleprompter.js -->
  <script id="chords-data" type="application/json">
    {{ relevant_chords_json|safe }}
  </script>

  <!-- ✅ Full per-instrument chord dictionary, used to look up the real
       diagram for a chord after transposing (not just shift the shape) -->
  <script id="full-chord-library" type="application/json">
    {{ full_chord_library_json|safe }}
  </script>

  <!-- ✅ Single, correct teleprompter config -->
  <script id="teleprompter-config" type="application/json">
  {
    "initialScrollSpeed": {{ initial_scroll_speed|default:40 }},
    "userPreferences": {{ user_preferences_json|safe }}
  }
  </script>

  <!-- Chord Section (diagrams at the bottom or right, toggled by the layout buttons) -->
  <div id="chord-section">
    <div id="chord-diagrams"></div>
  </div>

  <!-- Initialize SONG -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      window.SONG = {
        id: "{{ song.id }}",
        title: "{{ song.title|escapejs }}",
        initialTranspose: 0,
        chords: JSON.parse(document.getElementById("chords-data").textContent)
      };
      console.log("✅ SONG loaded:", window.SONG);
    });
  </script>
  <script src="{% static 'songbook/js/teleprompter.js' %}"></script>

  <!-- Above / Inline chord style switch (instant, no reload). Keeps your
       place in the song when the line heights change. -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const root = document.documentElement;
      const buttons = {
        above: document.getElementById("chord-style-above"),
        inline: document.getElementById("chord-style-inline"),
      };

      function reflectState(style) {
        Object.entries(buttons).forEach(([name, btn]) => {
          if (btn) btn.setAttribute("aria-pressed", String(name === style));
        });
      }

      function setChordStyle(style) {
        const container = document.querySelector(".lyrics-container");
        const maxScroll = () => (container ? container.scrollHeight - container.clientHeight : 0);
        const ratio = container && maxScroll() > 0 ? container.scrollTop / maxScroll() : 0;

        root.setAttribute("data-chord-style", style);
        try { localStorage.setItem("chordStyle", style); } catch (e) {}
        reflectState(style);

        if (container) {
          const top = ratio * maxScroll();
          container.scrollTop = top;
          // keep teleprompter.js's auto-scroll position in step (as the BlueTurn code does)
          if (typeof window.scrollPos !== "undefined") window.scrollPos = top;
        }
      }

      Object.entries(buttons).forEach(([name, btn]) => {
        if (btn) btn.addEventListener("click", () => setChordStyle(name));
      });
      reflectState(root.getAttribute("data-chord-style") || "above");
    });
  </script>

  <!-- Fix for chords that have a space right after them in the ChordPro
       data (e.g. "[C6] Tell me", "want[F] some more"). The renderer leaves
       those chord-words empty, which made the chord name drop below the
       others and swallowed the space. This re-attaches the chord to the
       next word and restores the space. Runs once, on load. -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // The words a .chord-word displays, ignoring the chord name itself.
      const lyricTextOf = (el) => {
        const clone = el.cloneNode(true);
        clone.querySelectorAll(".chord-label").forEach((l) => l.remove());
        return clone.textContent;
      };

      // True if there is already lyric text earlier on the same line that
      // does not end in a space (so a space needs to be put back).
      const needsSpaceBefore = (node) => {
        for (let p = node.previousSibling; p; p = p.previousSibling) {
          if (p.nodeName === "BR") return false;
          const text = p.nodeType === Node.TEXT_NODE ? p.textContent : lyricTextOf(p);
          if (text === "") continue;
          if (text.trim() === "") return false; // whitespace already there
          return !/\s$/.test(text);
        }
        return false; // start of a line
      };

      let fixed = 0;
      document.querySelectorAll(".lyrics .chord-word").forEach((word) => {
        if (lyricTextOf(word).trim() !== "") return; // chord already sits on a word

        // Drop stray whitespace held inside the empty chord-word.
        Array.from(word.childNodes).forEach((n) => {
          if (n.nodeType === Node.TEXT_NODE && n.textContent.trim() === "") n.remove();
        });

        // Pull the next word (the one the chord belongs over) into it.
        const next = word.nextSibling;
        if (!next || next.nodeType !== Node.TEXT_NODE) return;
        const m = next.textContent.match(/^(\s*)(\S+)([\s\S]*)$/);
        if (!m) return;

        const spaceBefore = needsSpaceBefore(word);
        word.appendChild(document.createTextNode(m[2]));
        next.textContent = m[3];
        if (spaceBefore) word.parentNode.insertBefore(document.createTextNode(" "), word);
        fixed++;
      });
      console.log(`🎵 Re-attached ${fixed} chord(s) that had a space after them`);
    });
  </script>


  <script>
    // 🎸 iRig BlueTurn Support - Synced with auto-scroll
    document.addEventListener("DOMContentLoaded", () => {
      const lyricsContainer = document.querySelector(".lyrics-container");
      const scrollAmount = 150;

      const indicator = document.createElement("div");
      indicator.style.cssText = `
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0,0,0,0.8);
        color: white;
        padding: 20px 40px;
        border-radius: 10px;
        font-size: 24px;
        z-index: 9999;
        display: none;
        pointer-events: none;
      `;
      document.body.appendChild(indicator);

      function showIndicator(text) {
        indicator.textContent = text;
        indicator.style.display = "block";
        setTimeout(() => indicator.style.display = "none", 500);
      }

      document.addEventListener("keydown", (e) => {
        if (["ArrowLeft", "ArrowRight", "PageUp", "PageDown"].includes(e.key)) {
          e.preventDefault();
        }

        if (!lyricsContainer) return;

        switch(e.key) {
          case "ArrowLeft":
          case "PageUp":
            if (typeof window.scrollPos !== 'undefined') {
              window.scrollPos = Math.max(0, window.scrollPos - scrollAmount);
              lyricsContainer.scrollTop = window.scrollPos;
            } else {
              lyricsContainer.scrollTop -= scrollAmount;
            }
            showIndicator("⬆️");
            break;

          case "ArrowRight":
          case "PageDown":
            if (typeof window.scrollPos !== 'undefined') {
              const maxScroll = lyricsContainer.scrollHeight - lyricsContainer.clientHeight;
              window.scrollPos = Math.min(maxScroll, window.scrollPos + scrollAmount);
              lyricsContainer.scrollTop = window.scrollPos;
            } else {
              lyricsContainer.scrollTop += scrollAmount;
            }
            showIndicator("⬇️");
            break;
        }
      });

      console.log("🎸 iRig BlueTurn enabled (synced with auto-scroll)");
    });
  </script>
</body>
</html>
