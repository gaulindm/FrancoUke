<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong</title>
  <style>
    :root { --bg:#f5f6f8; --card:#fff; --text:#222; --muted:#666; --accent:#0d6efd; --border:#e2e4e8; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#16181c; --card:#20242a; --text:#eee; --muted:#9aa0a8; --accent:#6ea8fe; --border:#333a42; }
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           padding:1.5rem; background:var(--bg); color:var(--text);
           font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    .card { max-width:30rem; width:100%; text-align:center; background:var(--card);
            border:1px solid var(--border); border-radius:1rem; padding:2.5rem 2rem;
            box-shadow:0 4px 18px rgba(0,0,0,.08); }
    .icon { font-size:3rem; line-height:1; margin-bottom:.75rem; }
    h1 { font-size:1.5rem; margin:0 0 .75rem; }
    p { margin:.5rem 0; line-height:1.5; }
    .detail { color:var(--muted); font-size:.95rem; }
    a.btn { display:inline-block; margin-top:1.5rem; padding:.6rem 1.2rem; border-radius:.5rem;
            text-decoration:none; background:var(--accent); color:#fff; font-weight:600; }
    @media (prefers-color-scheme: dark) { a.btn { color:#111; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">🛠️</div>
    <h1>Something went wrong on our end</h1>
    <p>Sorry about that. The problem has been noted, and it's not something you did.</p>
    <p class="detail">Please try again in a few minutes.</p>
    <a class="btn" href="/">Back to the home page</a>
  </main>
</body>
</html>
