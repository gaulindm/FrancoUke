<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Members only</title>
  <style>
    :root { --bg:#f5f6f8; --card:#fff; --text:#222; --muted:#666; --accent:#0d6efd; --border:#e2e4e8; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#16181c; --card:#20242a; --text:#eee; --muted:#9aa0a8; --accent:#6ea8fe; --border:#333a42; }
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           padding:1.5rem; background:var(--bg); color:var(--text);
           font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    .card { max-width:30rem; width:100%; text-align:center; background:var(--card);
            border:1px solid var(--border); border-radius:1rem; padding:2.5rem 2rem;
            box-shadow:0 4px 18px rgba(0,0,0,.08); }
    .icon { font-size:3rem; line-height:1; margin-bottom:.75rem; }
    h1 { font-size:1.5rem; margin:0 0 .75rem; }
    p { margin:.5rem 0; line-height:1.5; }
    .detail { color:var(--muted); font-size:.95rem; }
    .actions { margin-top:1.5rem; display:flex; gap:.75rem; justify-content:center; flex-wrap:wrap; }
    a.btn { display:inline-block; padding:.6rem 1.2rem; border-radius:.5rem; text-decoration:none;
            border:1px solid var(--accent); color:var(--accent); font-weight:600; }
    a.btn.primary { background:var(--accent); color:#fff; }
    @media (prefers-color-scheme: dark) { a.btn.primary { color:#111; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">🔒</div>
    <h1>This area is for club members</h1>
    <p>You're signed in, but your account doesn't have access to this page.</p>
    {% if exception %}<p class="detail">{{ exception }}</p>{% endif %}
    <p class="detail">If you think you should have access, please contact your group leader.</p>
    <div class="actions">
      <a class="btn primary" href="{% url 'landing' %}">Back to the clubs</a>
      {% if not user.is_authenticated %}
        <a class="btn" href="{% url 'users:login' %}">Log in</a>
      {% endif %}
    </div>
  </main>
</body>
</html>
