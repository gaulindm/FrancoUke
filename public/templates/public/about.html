{% extends "groups/base.html" %}
{% block title %}About {{ group.name|default:"Us" }}{% endblock %}

{% block content %}
<div class="text-center">
    <h2>About {{ group.name|default:"Us" }}</h2>
    {% if group.description %}
        <div class="lead">{{ group.description|linebreaks }}</div>
    {% else %}
        <p class="lead">More information coming soon.</p>
    {% endif %}
</div>
{% endblock %}
